name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: swift build and tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Tests
        # The cloud's tests are not in this repository; MOE_SKIP_PG=1 tells
        # the runner not to start the PostgreSQL they need.
        env:
          MOE_SKIP_PG: "1"
        run: ./scripts/test.sh
